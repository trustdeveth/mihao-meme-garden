# Contracts for the optional MGRD layer on BNB Chain. Build with `npm run chain:build` (Foundry).
# OpenZeppelin comes from npm (pinned in tools/package.json), so no git submodules are needed.
[profile.default]
src = "contracts"
out = "out"
cache_path = "cache"
libs = []
allow_paths = ["../node_modules"]
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
