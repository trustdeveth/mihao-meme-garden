[package]
name = "garden_rewards"
version = "0.1.0"
description = "Meme Garden: MGRD weekly reward claims (Merkle) and cosmetic order payments"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "garden_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
short-days = [] # TEST ONLY: lock days last one second (see chain/scripts/build-test.sh)

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
